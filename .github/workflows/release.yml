name: Test and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_PATH: /tmp/opportunity-hunter-ci.db
      APP_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --experimental-strip-types scripts/webhook-check.mjs
      - run: node --test edge/worker.test.mjs
      - run: npm run build
      - name: Smoke-test production server
        run: |
          npm start > /tmp/opty-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          node scripts/verify-release.mjs http://localhost:3000 "$GITHUB_SHA"
  release:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      APP_COMMIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require deployment credentials
        run: |
          test -n "$RAILWAY_TOKEN" || { echo 'Missing RAILWAY_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - run: npm install --global @railway/cli@4.30.5 wrangler@4.92.0
      - name: Stamp this release
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > release.json
      - name: Deploy tested commit to Railway
        run: railway up --ci --project 6b1c7cc0-1867-4026-9bd7-aae83c81d126 --environment e830ff6f-7583-4845-a8a6-d355bb38a716 --service 65f51da9-0a10-4850-b31b-099ff99b2512
      - name: Verify origin serves this commit
        run: node scripts/verify-release.mjs https://web-production-b2a12.up.railway.app "$GITHUB_SHA"
      - name: Publish Cloudflare delivery
        run: wrangler deploy --var "RELEASE_SHA:$GITHUB_SHA"
      - name: Verify public release and no-store headers
        run: node scripts/verify-release.mjs https://opportunityhunter.xyz "$GITHUB_SHA" edge
